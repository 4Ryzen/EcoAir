<!DOCTYPE html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Cadastro | EcoAir</title><link rel="stylesheet" href="css/style.css"></head>
<body><header id="topo"></header><main>
<h1>Criar conta</h1>
<form id="form-cadastro"><label for="n">Nome</label><input id="n" name="nome" required autocomplete="name"><label for="e">E-mail</label><input id="e" name="email" type="email" required autocomplete="email"><label for="s">Senha</label><input id="s" name="senha" type="password" required minlength="6" autocomplete="new-password"><label for="s2">Repita a senha</label><input id="s2" name="senha2" type="password" required autocomplete="new-password"><button class="btn">Criar conta</button><div id="msg" role="alert"></div><p>Já tem conta? <a href="login.html">Entrar</a></p></form>
</main><footer id="rodape"></footer><script src="js/app.js"></script></body></html>
